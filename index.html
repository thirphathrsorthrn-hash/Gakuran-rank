<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gakuran Fight Rankings</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Kanit', sans-serif; 
        }

        body { 
            background-color: #0d0d0d; 
            color: #f1f1f1; 
            padding: 20px; 
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #0d0d0d 100%); 
            min-height: 100vh; 
        }

        header { 
            text-align: center; 
            margin-bottom: 25px; 
        }

        header h1 { 
            color: #ffd700; 
            font-size: 2.5rem; 
            font-weight: 800; 
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.4); 
        }

        header p {
            color: #c0c0c0;
            font-size: 1rem;
        }

        .container { 
            max-width: 650px; 
            margin: 0 auto; 
        }

        .add-player-box { 
            background: linear-gradient(145deg, #161616, #1c1c1c); 
            padding: 18px; 
            border-radius: 10px; 
            margin-bottom: 20px; 
            border: 1px solid #c59b27; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .add-player-box h3 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #ffd700;
        }

        .form-group { 
            display: flex; 
            gap: 10px; 
        }

        .form-group input { 
            padding: 10px 14px; 
            border-radius: 6px; 
            border: 1px solid #444; 
            background: #0d0d0d; 
            color: #fff; 
            flex: 1; 
        }

        .form-group input:focus {
            border-color: #ffd700;
            outline: none;
        }

        .form-group button { 
            padding: 10px 20px; 
            background: linear-gradient(135deg, #ffd700, #b8860b); 
            color: #000;
            border: none; 
            border-radius: 6px; 
            font-weight: 800; 
            cursor: pointer; 
        }

        .form-group button:hover {
            opacity: 0.9;
        }

        .search-box { 
            margin-bottom: 15px; 
            text-align: right;
        }

        .search-box input { 
            width: 100%; 
            max-width: 250px;
            padding: 8px 12px; 
            border-radius: 6px; 
            border: 1px solid #444; 
            background: #161616; 
            color: #fff; 
        }

        .leaderboard-table { 
            background: #161616; 
            border-radius: 10px; 
            overflow: hidden; 
            border: 1px solid #333; 
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            text-align: center;
        }

        th, td { 
            padding: 14px 18px; 
            border-bottom: 1px solid #222; 
        }

        th { 
            background-color: #111;
            color: #ffd700; 
            border-bottom: 2px solid #c59b27; 
        }

        tr:hover {
            background-color: #1f1f1f;
        }

        .rank-badge-img { 
            width: 45px; 
            height: 45px; 
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.7)); 
        }

        .action-btn-group { 
            display: flex; 
            gap: 6px; 
            justify-content: center; 
        }

        .btn-up { 
            background-color: #1b5e20; 
            color: white; 
            border: 1px solid #2e7d32; 
            padding: 5px 12px; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold; 
        }

        .btn-up:hover { 
            background-color: #2e7d32; 
        }

        .btn-down { 
            background-color: #b71c1c; 
            color: white; 
            border: 1px solid #c62828; 
            padding: 5px 12px; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold; 
        }

        .btn-down:hover { 
            background-color: #b71c1c; 
        }

        .rank-1 { color: #ffd700; font-weight: bold; text-shadow: 0 0 8px rgba(255, 215, 0, 0.5); }
        .rank-2 { color: #c0c0c0; font-weight: bold; }
        .rank-3 { color: #cd7f32; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>🥋 GAKURAN RANKINGS 🥋</h1>
        <p>การจัดอันดับแรงค์ LueatYen Academy</p>
    </header>

    <main class="container">
        <!-- ช่องลงทะเบียน -->
        <div class="add-player-box">
            <h3>ลงทะเบียนนักสู้ใหม่</h3>
            <div class="form-group">
                <input type="text" id="newName" placeholder="ชื่อในเกม (Username)">
                <button onclick="addPlayer()">เพิ่มผู้เล่น</button>
            </div>
        </div>

        <!-- ช่องค้นหา -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ค้นหาชื่อผู้เล่น..." onkeyup="filterPlayers()">
        </div>

        <!-- ตารางแรงค์ -->
        <div class="leaderboard-table">
            <table>
                <thead>
                    <tr>
                        <th>อันดับ</th>
                        <th>ผู้เล่น</th>
                        <th>แรงค์</th>
                        <th>จัดการ</th>
                    </tr>
                </thead>
                <tbody id="rankTableBody">
                    <!-- ข้อมูลจะถูกดึงมาใส่อัตโนมัติ -->
                </tbody>
            </table>
        </div>
    </main>

    <script>
        let playersData = JSON.parse(localStorage.getItem('gakuranPlayers')) || [
            { name: "Tyson_Legend", wins: 320 },
            { name: "BangkokBrawler", wins: 220 },
            { name: "GakuranKing99", wins: 170 },
            { name: "ShadowFist", wins: 110 },
            { name: "StreetPunk", wins: 45 }
        ];

        function saveToLocalStorage() {
            localStorage.setItem('gakuranPlayers', JSON.stringify(playersData));
        }

        // ฟังก์ชันคำนวณแรงค์ตามเกณฑ์ใหม่ (F=50, D=100, C=150, B=200, A=250, S=300)
        function getRankBadge(wins) {
            let tier = "F";
            let imgUrl = "https://i.ibb.co/svGXhDts/file-00000000194c82118649f842021022dc.png"; // แรงค์ F (< 50)

            if (wins >= 300) {
                tier = "S";
                imgUrl = "https://i.ibb.co/kgwXKDG1/file-00000000161881fa9531b2e7830c0ca3.png"; // แรงค์ S (>= 300)
            } else if (wins >= 250) {
                tier = "A";
                imgUrl = "https://i.ibb.co/G3VqSSV8/file-000000000f5481fab3c2339d59d73231.png"; // แรงค์ A (>= 250)
            } else if (wins >= 200) {
                tier = "B";
                imgUrl = "https://i.ibb.co/rGrTWbC3/file-00000000c4c881fa99f5871675a3ef61.png"; // แรงค์ B (>= 200)
            } else if (wins >= 150) {
                tier = "C";
                imgUrl = "https://i.ibb.co/GvQdCG5Y/file-00000000ff2481faa06512cceb5b3c7f.png"; // แรงค์ C (>= 150)
            } else if (wins >= 50) {
                tier = "D";
                imgUrl = "https://i.ibb.co/bjQZrPm0/file-0000000020f481fa8231c4d3126ac5da.png"; // แรงค์ D (>= 50)
            }

            return `<img src="${imgUrl}" alt="Rank ${tier}" class="rank-badge-img">`;
        }

        function displayTable(data) {
            const tableBody = document.getElementById("rankTableBody");
            tableBody.innerHTML = "";
            data.sort((a, b) => b.wins - a.wins);

            data.forEach((player, index) => {
                let rankClass = "";
                if (index === 0) rankClass = "rank-1";
                else if (index === 1) rankClass = "rank-2";
                else if (index === 2) rankClass = "rank-3";

                tableBody.innerHTML += `
                    <tr>
                        <td class="${rankClass}">#${index + 1}</td>
                        <td><strong>${player.name}</strong></td>
                        <td>${getRankBadge(player.wins)}</td>
                        <td>
                            <div class="action-btn-group">
                                <button class="btn-up" onclick="changeRank(${index}, 50)">+</button>
                                <button class="btn-down" onclick="changeRank(${index}, -50)">-</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        function changeRank(index, amount) {
            playersData[index].wins += amount;
            if (playersData[index].wins < 0) playersData[index].wins = 0;
            saveToLocalStorage();
            displayTable(playersData);
        }

        function addPlayer() {
            const input = document.getElementById("newName");
            const name = input.value.trim();

            if (name === "") {
                alert("กรุณากรอกชื่อผู้เล่น!");
                return;
            }

            const existingPlayer = playersData.find(p => p.name.toLowerCase() === name.toLowerCase());

            if (existingPlayer) {
                alert(`มีชื่อผู้เล่น ${existingPlayer.name} อยู่ในระบบแล้ว!`);
            } else {
                playersData.push({ name: name, wins: 0 }); // เริ่มต้นที่ 0 (แรงค์ F)
                saveToLocalStorage();
                displayTable(playersData);
            }

            input.value = "";
        }

        function filterPlayers() {
            const search = document.getElementById("searchInput").value.toLowerCase();
            const filtered = playersData.filter(p => p.name.toLowerCase().includes(search));
            displayTable(filtered);
        }

        window.onload = () => displayTable(playersData);
    </script>
</body>
</html>
